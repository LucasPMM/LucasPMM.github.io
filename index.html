<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Portfolio of Lucas Mariz, a senior software engineer working across web, mobile, and applied research."
    />
    <meta name="theme-color" content="#fdf9f4" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Lucas Mariz — Senior Software Engineer" />
    <meta
      property="og:description"
      content="Scalable web and mobile products, computer vision, and applied research."
    />
    <script>
      (() => {
        try {
          const storedTheme = window.localStorage.getItem('portfolio.theme')
          const hasStoredTheme = storedTheme === 'light' || storedTheme === 'dark'
          const hasDarkPreference =
            typeof window.matchMedia === 'function' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches
          const systemTheme = hasDarkPreference ? 'dark' : 'light'
          document.documentElement.dataset.theme = hasStoredTheme ? storedTheme : systemTheme
        } catch {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
    <title>Lucas Mariz — Senior Software Engineer</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
